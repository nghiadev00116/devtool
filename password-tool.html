<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);color-scheme:light dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tool Bảo Mật 6 Lớp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: single centered column, two mode tabs, a 6-key grid, one in/out pair */
  :root{
    --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eef0f5; --border:#d8dce6;
    --fg:#1a1d26; --muted:#5b6170; --accent:#4f46e5; --accent-fg:#ffffff;
    --good:#0f8a5f; --bad:#c0392b; --ring:rgba(79,70,229,.35);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e0f14; --surface:#171922; --surface-2:#1e212c; --border:#2a2e3b;
    --fg:#e7e9f0; --muted:#9aa0b0; --accent:#8b86ff; --accent-fg:#0e0f14;
    --good:#34d399; --bad:#f87171; --ring:rgba(139,134,255,.4); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e0f14; --surface:#171922; --surface-2:#1e212c; --border:#2a2e3b;
    --fg:#e7e9f0; --muted:#9aa0b0; --accent:#8b86ff; --accent-fg:#0e0f14;
    --good:#34d399; --bad:#f87171; --ring:rgba(139,134,255,.4); color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:28px 48px}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
  header{display:flex;flex-direction:column;gap:6px}
  h1{font-size:1.4rem;margin:0;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:10px}
  h1 .lock{width:1.5rem;height:1.5rem;color:var(--accent);flex:none}
  .sub{color:var(--muted);font-size:.9rem;margin:0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .tabs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
    padding:9px;border-radius:7px;cursor:pointer;transition:.15s}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
  label{font-size:.78rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
  textarea,input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    color:var(--fg);font-family:var(--mono);font-size:.95rem;padding:11px 12px;resize:vertical}
  textarea{min-height:64px;min-width:0}
  textarea:focus,input:focus{outline:2px solid var(--ring);outline-offset:1px;border-color:var(--accent)}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .keys .k{display:flex;flex-direction:column}
  .keys label{text-align:center;margin-bottom:4px;font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:700}
  .keys input{text-align:center;font-weight:600}
  .note{font-size:.78rem;color:var(--muted);margin:0}
  .btn{border:0;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;
    padding:13px;border-radius:10px;cursor:pointer;font-size:1rem;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .out{display:flex;flex-direction:column;gap:10px}
  .result{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:14px;
    min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .result .val{font-family:var(--mono);font-size:1.05rem;font-weight:600;word-break:break-all;min-width:0}
  .result.ok{border-style:solid;border-color:var(--good)}
  .result.err{border-style:solid;border-color:var(--bad)}
  .result.err .val{color:var(--bad);font-size:.9rem;font-weight:500}
  .result .placeholder{color:var(--muted);font-family:var(--sans);font-weight:400;font-size:.9rem}
  .copy{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;
    font-size:.8rem;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer}
  .copy:hover{border-color:var(--accent);color:var(--accent)}
  .copy[hidden]{display:none}
  .theme{position:fixed;top:env(safe-area-inset-top,0px);right:max(14px,env(safe-area-inset-right,0px));
    margin-top:10px;background:var(--surface);border:1px solid var(--border);color:var(--fg);
    width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;z-index:10}
  @media (max-width:420px){.keys{gap:8px}.card{padding:15px}}
</style>

<button class="theme" id="theme" aria-label="Đổi giao diện sáng/tối">◐</button>

<div class="wrap">
  <header>
    <h1>
      <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Tool Bảo Mật 6 Lớp
    </h1>
    <p class="sub">Giải mã / mã hóa mật khẩu bằng đúng công thức của anh Nghĩa. Lưu chuỗi giả công khai, giữ 6 số key riêng.</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-dec" aria-selected="true">🔓 Giải mã</button>
    <button role="tab" id="tab-enc" aria-selected="false">🔒 Mã hóa</button>
  </div>

  <div class="card">
    <div>
      <label id="lbl-in" for="input">Chuỗi mã hóa cần giải</label>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Dán chuỗi Base64 vào đây…"></textarea>
    </div>

    <div>
      <label>6 số bí mật (key)</label>
      <div class="keys">
        <div class="k"><label for="A">A</label><input id="A" type="number" inputmode="numeric" value="1"></div>
        <div class="k"><label for="B">B</label><input id="B" type="number" inputmode="numeric" value="2"></div>
        <div class="k"><label for="C">C</label><input id="C" type="number" inputmode="numeric" value="3"></div>
        <div class="k"><label for="X">X</label><input id="X" type="number" inputmode="numeric" value="4"></div>
        <div class="k"><label for="Y">Y</label><input id="Y" type="number" inputmode="numeric" value="5"></div>
        <div class="k"><label for="Z">Z</label><input id="Z" type="number" inputmode="numeric" value="6"></div>
      </div>
      <p class="note">Y bắt buộc khác 0. Sai một số bất kỳ sẽ ra chuỗi rác.</p>
    </div>

    <button class="btn" id="run">🔓 Giải mã</button>

    <div class="out">
      <label id="lbl-out">Kết quả</label>
      <div class="result" id="result">
        <span class="val placeholder" id="val">Kết quả sẽ hiện ở đây…</span>
        <button class="copy" id="copy" hidden>Copy</button>
      </div>
    </div>
  </div>
</div>

<script>
  "use strict";
  const $=id=>document.getElementById(id);
  const mod=(n,m)=>((n%m)+m)%m;
  const genShift=(i,a,b,c,x,y,z)=>Math.floor((((a*i)+b-c)*x)/y)+z;

  function encode(text,k){
    const bytes=new TextEncoder().encode(text);
    let bin="";
    bytes.forEach((by,i)=>bin+=String.fromCharCode(mod(by+genShift(i,...k),256)));
    return btoa(bin);
  }
  function decode(enc,k){
    const bin=atob(enc.trim());
    const out=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) out[i]=mod(bin.charCodeAt(i)-genShift(i,...k),256);
    return new TextDecoder("utf-8",{fatal:true}).decode(out);
  }

  let mode="dec"; // dec | enc
  function setMode(m){
    mode=m;
    const dec=m==="dec";
    $("tab-dec").setAttribute("aria-selected",dec);
    $("tab-enc").setAttribute("aria-selected",!dec);
    $("lbl-in").textContent=dec?"Chuỗi mã hóa cần giải":"Mật khẩu thật cần giấu";
    $("input").placeholder=dec?"Dán chuỗi Base64 vào đây…":"Nhập mật khẩu gốc…";
    $("lbl-out").textContent=dec?"Mật khẩu gốc":"Chuỗi an toàn để lưu công khai";
    $("run").textContent=dec?"🔓 Giải mã":"🔒 Mã hóa";
    clearResult();
  }
  function clearResult(){
    const r=$("result"); r.className="result";
    $("val").className="val placeholder";
    $("val").textContent="Kết quả sẽ hiện ở đây…";
    $("copy").hidden=true;
  }
  function getKeys(){
    const ids=["A","B","C","X","Y","Z"];
    const k=ids.map(id=>parseInt($(id).value,10));
    if(k.some(n=>!Number.isFinite(n))) return {err:"Hãy nhập đủ 6 số."};
    if(k[4]===0) return {err:"Số Y không được bằng 0 (tránh chia cho 0)."};
    return {k};
  }
  function show(text,ok){
    const r=$("result");
    r.className="result "+(ok?"ok":"err");
    const v=$("val"); v.className="val"; v.textContent=text;
    $("copy").hidden=!ok;
  }
  function run(){
    const input=$("input").value;
    if(!input.trim()){ clearResult(); return; }
    const {k,err}=getKeys();
    if(err){ show(err,false); return; }
    try{
      show(mode==="dec"?decode(input,k):encode(input,k),true);
    }catch(e){
      show(mode==="dec"?"Không giải được. Kiểm tra lại chuỗi hoặc 6 số key.":"Không mã hóa được chuỗi này.",false);
    }
  }

  $("tab-dec").onclick=()=>setMode("dec");
  $("tab-enc").onclick=()=>setMode("enc");
  $("run").onclick=run;
  $("input").addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter")run();});

  $("copy").onclick=async()=>{
    const txt=$("val").textContent;
    try{ await navigator.clipboard.writeText(txt); $("copy").textContent="Đã copy ✓";
      setTimeout(()=>$("copy").textContent="Copy",1400);
    }catch(_){ const r=document.createRange(); r.selectNodeContents($("val"));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  };

  // theme toggle (per-viewer convenience)
  const root=document.documentElement;
  try{ const saved=localStorage.getItem("pwtool-theme"); if(saved) root.setAttribute("data-theme",saved); }catch(_){}
  $("theme").onclick=()=>{
    const dark=getComputedStyle(root).colorScheme.includes("dark");
    const next=dark?"light":"dark";
    root.setAttribute("data-theme",next);
    try{ localStorage.setItem("pwtool-theme",next); }catch(_){}
  };

  // demo state at rest: the example from password.py
  $("input").value="U21ucGlJOzw+";
  run();
</script>

</html>
